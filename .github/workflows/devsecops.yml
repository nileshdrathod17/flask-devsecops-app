name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: flask-devsecops-app

jobs:

  build-security-scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      ################################################
      # SECURITY SCAN - PYTHON SOURCE
      ################################################
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Tools
        run: |
          pip install bandit safety

      - name: Run Bandit Scan
        run: |
          bandit -r . -f html -o bandit-report.html

      ################################################
      # INSTALL DEPENDENCIES
      ################################################
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      ################################################
      # UNIT TESTING
      ################################################
      - name: Run Test Cases
        run: |
          pytest

      ################################################
      # OWASP DEPENDENCY CHECK
      ################################################
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: Flask-DevSecOps
          path: .
          format: HTML

      ################################################
      # DOCKER BUILD
      ################################################
      - name: Build Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.run_number }} .

      ################################################
      # TRIVY IMAGE SCAN
      ################################################
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.run_number }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      ################################################
      # LOGIN TO DOCKER HUB
      ################################################
      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ################################################
      # PUSH IMAGE
      ################################################
      - name: Tag Image
        run: |
          docker tag \
          ${{ env.IMAGE_NAME }}:${{ github.run_number }} \
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Push Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}